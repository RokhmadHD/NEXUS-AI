experiment:
  id: EXP-003A
  name: parameter_matched_transformer_baseline
  status: implementation
  seed: 42

comparison:
  reference_model: NEXUS-HSR-Tiny
  baseline_model: Transformer-Baseline
  parameter_match_tolerance_percent: 0.1
  same_vocab_size: true
  same_context_length: true
  same_embedding_dim: true
  same_attention_heads: true
  same_dropout: true

# This value matches the currently generated v0.1 tokenizer.
# Re-derive it from VocabularyTokenizer.load(...).vocab_size if the
# training corpus or tokenizer is regenerated.
nexus_hsr:
  vocab_size: 54
  context_length: 256
  embedding_dim: 128
  num_heads: 4
  encoder_layers: 2
  decoder_layers: 2
  ffn_dim: 512
  latent_iterations: 2
  symbolic_slots: 16
  dropout: 0.0

transformer_baseline:
  vocab_size: 54
  context_length: 256
  embedding_dim: 128
  num_heads: 4
  num_layers: 4
  ffn_dim: 721
  dropout: 0.0

notes:
  - "The baseline uses a wider feed-forward dimension to match total trainable parameters."
  - "Parameter matching must be re-verified for the active vocabulary and model configuration."
  - "The active v0.1 tokenizer currently contains 54 tokens; do not use the generic 2048-token default for this run."
  - "This experiment is an architectural control, not a training or reasoning result."
